baseURL = "https://kelvinmaina.com"
languageCode = "en-us"
title = "Kelvin Maina Wangari"
theme = "PaperMod"
enableRobotsTXT = true
buildDrafts = false
buildFuture = false
buildExpired = false

[pagination]
  pagerSize = 5

[minify]
  disableXML = true
  minifyOutput = true

[params]
  env = "production"
  title = "Kelvin Maina Wangari"
  description = "Software Developer, IT Consultant, and Computer Science Educator with over five years of experience working across both tech and education."
  keywords = ["software developer", "IT consultant", "computer science educator", "web development", "cloud", "Kenya", "Somaliland", "Seychelles"]
  author = "Kelvin Maina Wangari"
  images = ["/img/notion/white/my-notion-face-transparent.png"]
  DateFormat = "January 2, 2006"
  defaultTheme = "auto"
  disableThemeToggle = false

  ShowReadingTime = true
  ShowShareButtons = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowWordCount = true
  ShowRssButtonInSectionTermList = true
  UseHugoToc = true
  disableSpecial1stPost = false
  disableScrollToTop = false
  comments = false
  hidemeta = false
  hideSummary = false
  showtoc = true
  tocopen = false

  [params.assets]
    favicon = "/favicon.svg"
    favicon16x16 = "/favicon.svg"
    favicon32x32 = "/favicon.svg"
    apple_touch_icon = "/favicon.svg"
    safari_pinned_tab = "/favicon.svg"

  [params.label]
    text = "Kelvin Maina"
    icon = "/favicon.svg"
    iconHeight = 35

  [params.profileMode]
    enabled = true
    title = "Kelvin Maina Wangari"
    subtitle = "Software Developer · IT Consultant · Computer Science Educator"
    imageUrl = "/img/notion/white/my-notion-face-transparent.png"
    imageWidth = 120
    imageHeight = 120
    imageTitle = "Kelvin Maina Wangari"
    [[params.profileMode.buttons]]
      name = "Posts"
      url = "/posts"
    [[params.profileMode.buttons]]
      name = "Projects"
      url = "/projects"
    [[params.profileMode.buttons]]
      name = "Experience"
      url = "/experience"
    [[params.profileMode.buttons]]
      name = "About"
      url = "/about"

  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/KelvinMW/"

  [[params.socialIcons]]
    name = "linkedin"
    url = "https://www.linkedin.com/in/kelvin-maina-w-522877a4/"

  [[params.socialIcons]]
    name = "x"
    url = "https://x.com/MKelvinW"

  [[params.socialIcons]]
    name = "email"
    url = "mailto:support@kelvinmaina.com"

  [[params.socialIcons]]
    name = "facebook"
    url = "https://www.facebook.com/wkelvinm/"

  [[params.socialIcons]]
    name = "rss"
    url = "/index.xml"

  [params.analytics]
    [params.analytics.google]
      SiteVerificationTag = ""

  [params.cover]
    hidden = false
    hiddenInList = false
    hiddenInSingle = false

  [params.editPost]
    URL = "https://github.com/KelvinMW/kelvinmw.github.io/edit/main"
    Text = "Suggest Changes"
    appendFilePath = true

  [params.fuseOpts]
    isCaseSensitive = false
    shouldSort = true
    location = 0
    distance = 1000
    threshold = 0.4
    minMatchCharLength = 0
    limit = 10
    keys = ["title", "permalink", "summary", "content"]

[menu]
  [[menu.main]]
    identifier = "posts"
    name = "Posts"
    url = "/posts/"
    weight = 10
  [[menu.main]]
    identifier = "projects"
    name = "Projects"
    url = "/projects/"
    weight = 20
  [[menu.main]]
    identifier = "experience"
    name = "Experience"
    url = "/experience/"
    weight = 30
  [[menu.main]]
    identifier = "about"
    name = "About"
    url = "/about/"
    weight = 40
  [[menu.main]]
    identifier = "search"
    name = "Search"
    url = "/search/"
    weight = 50
  [[menu.main]]
    identifier = "archives"
    name = "Archives"
    url = "/archives/"
    weight = 60

[taxonomies]
  category = "categories"
  tag = "tags"
  series = "series"

[outputs]
  home = ["HTML", "RSS", "JSON"]
